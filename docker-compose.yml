services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8080:8080"
    image: raakz/devops-for-developers-project-74
    depends_on:
      - db
    environment:
      - DATABASE_NAME=blog_development
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_PORT=5432
      - DATABASE_HOST=db
      - NODE_ENV=production
    command: >
      sh -c "node -e '
        const net = require(\"net\");
        function waitForDB() {
          const socket = net.createConnection(5432, \"db\");
          socket.on(\"connect\", () => {
            console.log(\"Database ready!\");
            socket.destroy();
            require(\"child_process\").exec(\"make start\", {stdio: \"inherit\"});
          });
          socket.on(\"error\", () => {
            console.log(\"Waiting for database...\");
            setTimeout(waitForDB, 1000);
          });
        }
        waitForDB();
      '"