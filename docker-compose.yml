services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8080:8080"
    image: raakz/devops-for-developers-project-74
    depends_on:
      - db
    environment:
      - DATABASE_NAME=blog_development
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password
      - DATABASE_PORT=5432
      - DATABASE_HOST=db
      - NODE_ENV=test
    command: >
      sh -c "
        node -e '
          const net = require(\"net\");
          function waitForDB() {
            const socket = net.createConnection(5432, \"db\");
            socket.on(\"connect\", () => {
              console.log(\"Database ready!\");
              socket.destroy();
              require(\"child_process\").exec(\"make test\", {stdio: \"inherit\"});
            });
            socket.on(\"error\", () => {
              console.log(\"Waiting for database...\");
              setTimeout(waitForDB, 1000);
            });
          }
          waitForDB();
        '
      "

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=blog_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: